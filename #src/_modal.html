<div class="modal modal1">
    <div class="modal__wrapper modal1__wrapper"></div>
    <div class="modal__content modal1__content">
        <div class="modal__close" onClick="closeModal1()">
            <img src="assets/img/icons/close.svg" alt="icon">
        </div>
        <div class="recrut__app modal1__inner">
            <b>ОТправьте ваше резюме</b>
            <form action="">
                <div class="recrut__app--top">
                    <input id="name" type="text" placeholder="ФИО" required>
                    <input id="tel" type="tel" placeholder="Номер телефона" required>
                </div>
                <textarea name="" id="" placeholder="Ваше сообщение"></textarea>
                <div class="recrut__app--btns">
                    <label for="" class="recrut__app--file">
                        <input type="file" value="">
                        <span>Приложить файл</span>
                    </label>
                    <button type="submit">Отправить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal modal3">

        <div class="modal__close" onClick="closeModal3()">
            <img src="assets/img/icons/close.svg" alt="icon">
        </div>
        <div class="modal3__inner">
            <svg xmlns="http://www.w3.org/2000/svg" width="88" height="68" viewBox="0 0 88 68" fill="none">
                <path d="M27.9891 53.8507L7.13906 33.0007L0.0390625 40.0507L27.9891 68.0007L87.9891 8.00068L80.9391 0.950684L27.9891 53.8507Z" fill="#1EFF00"/>
            </svg>
            <div class="modal3__title">Успешно отправлено</div>
            <a href="." class="modal3__btn">На главную страницу</a>
        </div>
    </div>
</div>
